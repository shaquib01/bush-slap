name: Deploy Bush Slap website preview

on:
  push:
    branches: [godot4-prototype]
    paths:
      - "godot/**"
      - ".github/workflows/deploy-godot-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bush-slap-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the existing browser website
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build the existing Vercel frontend
        run: npm run build
      - name: Confirm frontend output
        run: test -s dist/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
